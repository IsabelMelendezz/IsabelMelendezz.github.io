<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Inscripción a equipo | 8vo Ciclo sistemas</title>

<style>
    body {
        margin: 0;
        background: #F8F4EC;
        font-family: Arial, Helvetica, sans-serif;
        color: #4A3F35;
    }

    header, footer {
        background: #E8DCC8;
        text-align: center;
        padding: 12px;
    }

    footer {
        background: #DCCCB8;
    }

    main {
        max-width: 500px;
        margin: 40px auto;
        background: #FFFFFF;
        border: 1px solid #E8DCC8;
        border-radius: 8px;
        padding: 24px 32px;
    }

    h1 {
        text-align: center;
        font-size: 1.4rem;
        color: #4A3F35;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    label {
        font-weight: bold;
        display: block;
        margin-bottom: 4px;
    }

    input, select {
        width: 100%;
        padding: 8px;
        border: 1px solid #DCCCB8;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 1rem;
    }

    input[type="submit"] {
        background: #E8DCC8;
        border: none;
        cursor: pointer;
        font-weight: bold;
        padding: 10px;
    }

    input[type="submit"]:hover {
        background: #DCCCB8;
    }

    a.volver {
        display: inline-block;
        margin-top: 16px;
        color: #4A3F35;
    }
</style>

</head>
<body>

<header>
    <p><a href="index.html">← Volver al inicio</a></p>
</header>

<main>
    <h1>Inscripción a equipo 02-2026</h1>

    <form autocomplete="off">

        <!-- Carnet -->
        <div>
            <label for="studentId">Carné estudiante</label>
            <input type="text" id="studentId" required />
        </div>

        <!-- Nombre -->
        <div>
            <label for="studentNombre">Nombre estudiante</label>
            <input type="text" id="studentNombre" required />
        </div>

        <!-- Nacimiento -->
        <div>
            <label for="studentDate">Fecha de nacimiento</label>
            <input type="date" id="studentDate" required max="2010-07-23" />
        </div>

        <!-- Nombre del equipo -->
        <div>
            <label for="GroupName">Nombre del equipo</label>
            <input type="text" id="GroupName" required />
        </div>

        <!-- Seleccionar equipo -->
        <div>
            <label for="SelectTeamId">Seleccione su equipo</label>
            <select id="SelectTeamId">
                <option value="1">FC Barcelona</option>
                <option value="2">Real Madrid zona 18</option>
                <option value="3">Portales</option>
            </select>
        </div>

        <div>
            <input type="submit" value="Enviar" />
        </div>

    </form>
</main>

<footer>
    <p>2026 Isabel Meléndez</p>
</footer>

</body>
</html>
